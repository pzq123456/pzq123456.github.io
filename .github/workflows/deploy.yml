# Build + Deploy: validate -> sync -> build site -> render PDFs -> verify -> Pages
# 本地等价: npm run ci:local ; workflow 验证: act -j build
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk && fc-cache -f
      - name: Install node dependencies
        run: npm ci
      - name: Install python dependencies
        run: pip install jinja2 pillow reportlab requests pymupdf
      - name: CV validate (selftest)
        run: npm run cv:validate
      - name: CV sync (frontend adapter)
        run: npm run cv:sync
      - name: Build site
        run: npm run build
      - name: CV render (4 variants x 2 langs -> dist/cv, QA included)
        run: npm run cv:render
      - name: Verify dist/cv artifacts
        run: npm run cv:verify
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
