# Build + Deploy: verify committed CV artifacts -> sync -> build site -> Pages
# CV PDFs/previews are rendered locally (`npm run cv:render`) into public/cv and
# committed; CI never installs Python/Chrome or renders a PDF.
# 本地等价: npm run ci:local ; workflow 验证: act -j build
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Verify committed CV artifacts
        run: npm run cv:verify
      - name: Install node dependencies
        run: npm ci
      - name: CV sync (frontend adapter)
        run: npm run cv:sync
      - name: Build site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
