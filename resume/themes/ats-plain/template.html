<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>

<style>
  :root {
    --ink: #111111;
    --ink-soft: #111111;
    --muted: #333333;
    --faint: #333333;
    --hairline: #999999;
    --paper: #ffffff;
    --screen: #ffffff;

    /* User supplied accent (kept for contract; unused for ATS-plain visuals) */
    --accent: {{ theme.accent }};
    --accent-wash: {{ theme.accent_wash }};

    /* Explicit accent layers (computed in Python, no color-mix; unused here) */
    --accent-soft: {{ theme.accent_soft }};
    --accent-pale: {{ theme.accent_pale }};

    /* Layout */
    --page-top: 13mm;
    --page-right: 14mm;
    --page-bottom: 12mm;
    --page-left: 14mm;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  @page {
    size: A4;
    margin: var(--page-top)
            var(--page-right)
            var(--page-bottom)
            var(--page-left);
  }

  body {
    font-family:
      Arial,
      Helvetica,
      "Segoe UI",
      "Microsoft YaHei",
      sans-serif;
    font-size: 9.5pt;
    line-height: 1.5;
    color: #111111;
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  @media screen {
    body {
      background: #ffffff;
      padding: 24px 14px;
    }

    .sheet {
      width: min(800px, 100%);
      margin: 0 auto;
      background: #ffffff;
      padding: 12px 0 24px 0;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
  }

  @media print {
    .sheet {
      padding: 0;
    }
  }

  /* Links: standard blue underlined (documented choice; only non-grayscale on screen). */
  a {
    color: #0000EE;
    text-decoration: underline;
    text-underline-offset: 1px;
  }

  a:hover {
    text-decoration: underline;
  }

  header {
    margin: 0 0 10pt 0;
    padding: 0 0 8pt 0;
    border-bottom: 1pt solid #111111;
  }

  h1 {
    margin: 0;
    font-size: 18pt;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 0;
    color: #111111;
  }

  h1 .sep {
    color: #111111;
    font-weight: 400;
    margin: 0 6pt;
  }

  .role {
    margin: 4pt 0 4pt 0;
    font-size: 10pt;
    line-height: 1.4;
    color: #111111;
    font-weight: 700;
    letter-spacing: 0;
  }

  .contact {
    margin: 0;
    font-size: 8.5pt;
    line-height: 1.5;
    color: #111111;
    letter-spacing: 0;
  }

  .contact a {
    color: #0000EE;
    text-decoration: underline;
  }

  main {
    display: block;
  }

  section {
    margin: 0 0 10pt 0;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  section:last-child {
    margin-bottom: 0;
  }

  h2 {
    display: block;
    margin: 0 0 4pt 0;
    padding: 0 0 2pt 0;
    font-size: 11pt;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: #111111;
    border-bottom: 0.75pt solid #111111;
  }

  h2 .cn {
    margin-left: 6pt;
    font-size: 11pt;
    font-weight: 400;
    letter-spacing: 0;
    color: #111111;
  }

  .skills {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .skills li {
    margin: 0 0 2pt 0;
  }

  article.entry {
    margin: 0 0 6pt 0;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  article.entry:last-child {
    margin-bottom: 0;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12pt;
  }

  h3 {
    margin: 0;
    font-size: 10pt;
    line-height: 1.4;
    font-weight: 700;
    color: #111111;
  }

  h3 .title-link {
    color: #0000EE;
    text-decoration: underline;
  }

  time,
  .date {
    flex: none;
    font-size: 8.5pt;
    line-height: 1.4;
    color: #333333;
    white-space: nowrap;
  }

  p {
    margin: 0;
  }

  p + p {
    margin-top: 2pt;
  }

  ul.bullets {
    margin: 2pt 0 0 16pt;
    padding: 0;
    list-style: disc;
  }

  ul.bullets li {
    margin: 0 0 1.5pt 0;
    padding-left: 0;
  }

  ul.bullets li::marker {
    color: #111111;
  }

  .stack {
    margin: 2pt 0 0 0;
    font-size: 8.5pt;
    line-height: 1.45;
    color: #333333;
  }

  .links {
    margin: 2pt 0 0 0;
    font-size: 8.5pt;
    line-height: 1.45;
    color: #333333;
  }

  .links a {
    color: #0000EE;
    text-decoration: underline;
  }

  mark {
    background: none;
    background-color: transparent;
    color: #111111;
    font-weight: 700;
    padding: 0;
    border: none;
    border-radius: 0;
  }

  code {
    font-family: inherit;
    font-size: inherit;
    color: #111111;
    background: none;
    padding: 0;
    border: none;
    border-radius: 0;
  }

  @media print {
    section,
    article.entry,
    .row {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    h2 {
      break-after: avoid;
      page-break-after: avoid;
    }

    h3 {
      break-after: avoid;
      page-break-after: avoid;
    }

    a {
      color: #0000EE;
      text-decoration: underline;
    }
  }

</style>
</head>

<body>

<div class="sheet">

  <header>
    <h1>{{ name | safe }}</h1>

    <p class="role">
      {{ role | safe }}
    </p>

    <p class="contact">
      {{ contact | safe }}
    </p>
  </header>

  <main data-slot="main">
    {% for s in slots.main %}{{ s.html | safe }}{% endfor %}
  </main>

</div>

</body>
</html>
